---
swagger: '2.0'
info:
  version: '1.0.0'
  title: 'Instant Payments API'
  description: >-
    REST API contract for the Instant Payments sample application, derived from
    the cross-SDK verification suite (instant-payments-verification.http).
    Covers outbound payment creation with idempotency, payment processing,
    payment/account queries, reservation batch lookups and merchant payment
    listings backed by DynamoDB GSIs.
host: localhost:8080
basePath: /
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json

paths:
  /actuator/health:
    get:
      tags:
        - Infrastructure
      summary: Actuator health check
      operationId: getActuatorHealth
      responses:
        200:
          description: Service is healthy
          schema:
            $ref: '#/definitions/HealthResponse'

  /api-docs:
    get:
      tags:
        - Infrastructure
      summary: Published OpenAPI discovery document
      operationId: getApiDocs
      responses:
        200:
          description: OpenAPI document describing the service
          schema:
            type: object
            additionalProperties: true

  /api/v1/payments/outbound:
    post:
      tags:
        - Outbound Payments
      summary: Create (initiate) an outbound payment
      description: >-
        Idempotent creation of an outbound payment. Repeating the same request
        with the same idempotencyKey and identical body replays the original
        response (200). Reusing the same key with a different body conflicts (409).
      operationId: createOutboundPayment
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateOutboundPaymentRequest'
      responses:
        201:
          description: Payment created
          schema:
            $ref: '#/definitions/CreateOutboundPaymentResponse'
        200:
          description: Idempotent replay of a previously created payment
          schema:
            $ref: '#/definitions/CreateOutboundPaymentResponse'
        400:
          description: Validation error (missing/blank fields, invalid amount or currency, malformed JSON)
          schema:
            $ref: '#/definitions/ErrorResponse'
        409:
          description: Idempotency key reused with a conflicting request body
          schema:
            $ref: '#/definitions/ErrorResponse'

  /api/v1/payments/outbound/{paymentId}:
    get:
      tags:
        - Outbound Payments
      summary: Get an outbound payment with its event history
      operationId: getOutboundPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          type: string
          description: Identifier of the payment
      responses:
        200:
          description: Payment found
          schema:
            $ref: '#/definitions/GetOutboundPaymentResponse'
        404:
          description: Payment not found
          schema:
            $ref: '#/definitions/ErrorResponse'

  /api/v1/payments/outbound/{paymentId}/process:
    post:
      tags:
        - Outbound Payments
      summary: Process an outbound payment (validate, reserve, complete or reject)
      description: >-
        Advances the payment through its lifecycle. Processing is idempotent for
        terminal states (COMPLETED/REJECTED) and returns the current terminal
        state on repeat calls.
      operationId: processOutboundPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          type: string
          description: Identifier of the payment to process
      responses:
        200:
          description: Payment processed (COMPLETED or REJECTED)
          schema:
            $ref: '#/definitions/ProcessPaymentResponse'
        404:
          description: Payment not found
          schema:
            $ref: '#/definitions/ErrorResponse'

  /api/v1/accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Get an account with balances and reservations
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          type: string
          description: Account identifier (^[A-Za-z0-9_-]+$, max 64 chars)
          pattern: '^[A-Za-z0-9_-]+$'
          maxLength: 64
      responses:
        200:
          description: Account found
          schema:
            $ref: '#/definitions/GetAccountResponse'
        400:
          description: Malformed or too-long accountId
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: Account not found
          schema:
            $ref: '#/definitions/ErrorResponse'

  /api/v1/accounts/{accountId}/batch-get-reservations:
    post:
      tags:
        - Accounts
      summary: Batch get reservations for an account
      description: >-
        Looks up multiple reservations by id for the given account. Duplicate ids
        are deduplicated. Ids not found are returned under missingReservationIds.
      operationId: batchGetReservations
      parameters:
        - name: accountId
          in: path
          required: true
          type: string
          description: Account identifier (^[A-Za-z0-9_-]+$, max 64 chars)
          pattern: '^[A-Za-z0-9_-]+$'
          maxLength: 64
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/BatchGetReservationsRequest'
      responses:
        200:
          description: Reservation lookup result
          schema:
            $ref: '#/definitions/BatchGetReservationsResponse'
        400:
          description: Validation error (empty or oversized reservationIds, blank element, malformed accountId)
          schema:
            $ref: '#/definitions/ErrorResponse'

  /api/v1/merchants/{merchantId}/payments:
    get:
      tags:
        - Merchant Payments
      summary: List payments for a merchant (GSI, newest first by default)
      operationId: listMerchantPayments
      parameters:
        - name: merchantId
          in: path
          required: true
          type: string
          description: Merchant identifier
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
          default: 50
          description: Maximum items per page. Non-positive values are coerced to the default (50).
        - name: scanIndexForward
          in: query
          required: false
          type: boolean
          default: false
          description: When true, returns oldest payments first.
        - name: nextToken
          in: query
          required: false
          type: string
          description: Opaque pagination token from a previous response (this route only).
      responses:
        200:
          description: A page of merchant payment projections
          schema:
            $ref: '#/definitions/MerchantPaymentsPage'
        400:
          description: Invalid pagination token (wrong index or cross-merchant token)
          schema:
            $ref: '#/definitions/ErrorResponse'

  /api/v1/merchants/{merchantId}/payments/state/{state}:
    get:
      tags:
        - Merchant Payments
      summary: List payments for a merchant filtered by state (GSI)
      operationId: listMerchantPaymentsByState
      parameters:
        - name: merchantId
          in: path
          required: true
          type: string
          description: Merchant identifier
        - name: state
          in: path
          required: true
          type: string
          description: Payment state to filter by
          enum:
            - RECEIVED
            - COMPLETED
            - REJECTED
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
          default: 50
          description: Maximum items per page. Non-positive values are coerced to the default (50).
        - name: scanIndexForward
          in: query
          required: false
          type: boolean
          default: false
          description: When true, returns oldest payments first.
        - name: nextToken
          in: query
          required: false
          type: string
          description: Opaque pagination token from a previous response (this route only).
      responses:
        200:
          description: A page of merchant payment projections for the given state
          schema:
            $ref: '#/definitions/MerchantPaymentsPage'
        400:
          description: Invalid state path or invalid pagination token
          schema:
            $ref: '#/definitions/ErrorResponse'

definitions:
  HealthResponse:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        example: UP

  ErrorResponse:
    type: object
    required:
      - error
      - message
      - timestamp
    properties:
      error:
        type: string
        description: Machine-readable error code
        example: VALIDATION_ERROR
      message:
        type: string
        description: Human-readable error description
      timestamp:
        type: string
        format: date-time

  CreateOutboundPaymentRequest:
    type: object
    required:
      - idempotencyKey
      - merchantId
      - debtorAccountId
      - creditorIban
      - creditorName
      - amount
      - currency
    properties:
      idempotencyKey:
        type: string
        description: Client-supplied idempotency key (UUID)
      merchantId:
        type: string
      debtorAccountId:
        type: string
      creditorIban:
        type: string
      creditorName:
        type: string
      amount:
        type: number
        description: Positive payment amount
        minimum: 0
        exclusiveMinimum: true
      currency:
        type: string
        description: ISO 4217 currency code
        example: USD

  CreateOutboundPaymentResponse:
    type: object
    required:
      - paymentId
      - state
      - correlationId
      - createdAtUtc
    properties:
      paymentId:
        type: string
      state:
        type: string
        example: RECEIVED
      correlationId:
        type: string
        x-nullable: true
      createdAtUtc:
        type: string
        format: date-time

  ProcessPaymentResponse:
    type: object
    required:
      - paymentId
      - state
      - reasonCode
    properties:
      paymentId:
        type: string
      state:
        type: string
        example: COMPLETED
      reasonCode:
        type: string
        x-nullable: true

  GetOutboundPaymentResponse:
    type: object
    required:
      - paymentId
      - state
      - correlationId
      - createdAtUtc
      - updatedAtUtc
      - debtorAccountId
      - creditorIban
      - creditorName
      - amount
      - currency
      - idempotencyKey
      - reasonCode
      - version
      - events
    properties:
      paymentId:
        type: string
      state:
        type: string
      correlationId:
        type: string
        x-nullable: true
      createdAtUtc:
        type: string
        format: date-time
      updatedAtUtc:
        type: string
        format: date-time
      debtorAccountId:
        type: string
      creditorIban:
        type: string
      creditorName:
        type: string
      amount:
        type: number
      currency:
        type: string
      idempotencyKey:
        type: string
      reasonCode:
        type: string
        x-nullable: true
      version:
        type: integer
        format: int64
      events:
        type: array
        items:
          $ref: '#/definitions/PaymentEvent'

  PaymentEvent:
    type: object
    required:
      - eventKey
      - eventType
      - reasonCode
      - correlationId
    properties:
      eventKey:
        type: string
      eventType:
        type: string
      reasonCode:
        type: string
        x-nullable: true
      correlationId:
        type: string
        x-nullable: true

  GetAccountResponse:
    type: object
    required:
      - accountId
      - status
      - currency
      - currentBalance
      - availableBalance
      - reservations
    properties:
      accountId:
        type: string
      status:
        type: string
      currency:
        type: string
      currentBalance:
        type: number
      availableBalance:
        type: number
      reservations:
        type: array
        items:
          $ref: '#/definitions/ReservationResponse'

  ReservationResponse:
    type: object
    required:
      - reservationId
      - paymentId
      - amount
      - status
      - createdAtUtc
    properties:
      reservationId:
        type: string
      paymentId:
        type: string
      amount:
        type: number
      status:
        type: string
      createdAtUtc:
        type: string
        format: date-time

  BatchGetReservationsRequest:
    type: object
    required:
      - reservationIds
    properties:
      reservationIds:
        type: array
        description: Reservation ids to look up (1-100, deduplicated).
        minItems: 1
        maxItems: 100
        items:
          type: string

  BatchGetReservationsResponse:
    type: object
    required:
      - reservations
      - missingReservationIds
    properties:
      reservations:
        type: array
        items:
          $ref: '#/definitions/ReservationResponse'
      missingReservationIds:
        type: array
        items:
          type: string

  MerchantPaymentsPage:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/MerchantPaymentProjection'
      nextToken:
        type: string
        description: Present only when a further page exists.
        x-nullable: true

  MerchantPaymentProjection:
    type: object
    required:
      - paymentId
      - state
      - version
      - merchantId
      - correlationId
      - amount
      - currency
      - createdAtUtc
      - updatedAtUtc
      - reasonCode
    properties:
      paymentId:
        type: string
      state:
        type: string
      version:
        type: integer
        format: int64
      merchantId:
        type: string
      correlationId:
        type: string
        x-nullable: true
      amount:
        type: number
      currency:
        type: string
      createdAtUtc:
        type: string
        format: date-time
      updatedAtUtc:
        type: string
        format: date-time
      reasonCode:
        type: string
        x-nullable: true
