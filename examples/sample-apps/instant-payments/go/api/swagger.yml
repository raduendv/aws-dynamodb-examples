---
swagger: '2.0'
info:
  version: '1.0.0'
  title: 'Instant Payments Go'
paths:
  /:
    get:
      produces:
        - application/json
      parameters: []
      operationId: getHome
      responses:
        200:
          description: returns the home
          schema:
            type: string
  /api/v1/accounts/{accountId}:
    get:
      produces:
        - application/json
      parameters:
        - name: accountId
          required: true
          type: string
          in: path
          description: account id to get
      operationId: getApiV1Accounts
      responses:
        200:
          description: Get account with reservations 
          schema:
            type: string

definitions:
  # custom types
  CreatedAt:
    type: string
    format: date-time
    x-go-custom-tag: 'dynamodbav:"created_at,unixtime"'
  UpdatedAt:
    type: string
    format: date-time
    x-go-custom-tag: 'dynamodbav:"updated_at,unixtime"'
  ExpiresAt:
    type: string
    format: date-time
    x-go-custom-tag: 'dynamodbav:"ttl,unixtime"'
  # enums
  AccountStatus:
    type: string
    enum:
      - ACTIVE
      - INACTIVE
    x-go-custom-tag: 'dynamodbav:"status"'
  PaymentEventType:
    type: string
    enum:
      - INITIATED
      - SETTLED
    x-go-custom-tag: 'dynamodbav:"type"'
  # models
  Account:
    type: object
    properties:
      PK:
        type: string
        x-go-custom-tag: 'dynamodbav:"pk"'
      SK:
        type: string
        x-go-custom-tag: 'dynamodbav:"sk"'
      Name:
        type: string
        x-go-custom-tag: 'dynamodbav:"name"'
      Balance:
        type: integer
        format: int64
        x-go-custom-tag: 'dynamodbav:"balance"'
      Currency:
        type: string
        x-go-custom-tag: 'dynamodbav:"currency"'
      Status:
        $ref: '#/definitions/AccountStatus'
      CreatedAt:
        $ref: '#/definitions/CreatedAt'
      UpdatedAt:
        $ref: '#/definitions/UpdatedAt'
  IdempotencyRecord:
    type: object
    properties:
      PK:
        type: string
        x-go-custom-tag: 'dynamodbav:"pk"'
      SK:
        type: string
        x-go-custom-tag: 'dynamodbav:"sk"'
      RequestHash:
        type: string
        x-go-custom-tag: 'dynamodbav:"request_hash"'
      Response:
        type: string
        x-go-custom-tag: 'dynamodbav:"response"'
      CreatedAt:
        $ref: '#/definitions/CreatedAt'
      ExpiresAt:
        $ref: '#/definitions/ExpiresAt'
  PaymentEvent:
    type: object
    properties:
      PK:
        type: string
        x-go-custom-tag: 'dynamodbav:"pk"'
      SK:
        type: string
        x-go-custom-tag: 'dynamodbav:"sk"'
      Type:
        $ref: '#/definitions/PaymentEventType'
      Details:
        type: string
        x-go-custom-tag: 'dynamodbav:"details"'

  # request objects
  GetAccountByID:
    type: object
    properties:
      accountId:
        type: string
